<style>
:root{color-scheme:light;font-family:Arial,Helvetica,sans-serif;color:#173c27;background:#fff9ea}
*{box-sizing:border-box}
body{margin:0;min-height:100vh}
header{padding:22px clamp(20px,5vw,64px);background:#fffdf5;border-bottom:1px solid #e7dfca}

main{max-width:960px;margin:36px auto;padding:0 20px;text-align:center}

.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:30px auto}
.actions a{display:inline-block;padding:14px 23px;border-radius:40px;text-decoration:none;font-weight:700;background:#173c27;color:white}

<script>
(function(){

  document.getElementById('trailer').src='https://www.youtube-nocookie.com/embed/'+id+'?rel=0';
